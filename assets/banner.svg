<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18" />
      <stop offset="50%" stop-color="#0b1528" />
      <stop offset="100%" stop-color="#030710" />
    </linearGradient>

    <!-- Emerald / Cyan / Indigo Glowing Accents -->
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="75%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="gridBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Ambient Radials -->
    <radialGradient id="meshCenter" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#060c18" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cornerAmbient" cx="90%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#060c18" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.18); opacity: 0.45; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(9px) rotate(-1deg); }
    }
    @keyframes floatPill3 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(-1deg); }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes shimmerBar {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    @keyframes iconPulse {
      0%, 100% { filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.4)); }
      50% { filter: drop-shadow(0 0 24px rgba(6, 182, 212, 0.7)); }
    }

    .pulse-bg { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 600px 190px; }
    .float-card-1 { animation: floatPill1 6s ease-in-out infinite; }
    .float-card-2 { animation: floatPill2 7s ease-in-out infinite; }
    .float-card-3 { animation: floatPill3 6.5s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 80 320; animation: beamFlow 4s linear infinite; }
    .shimmer { animation: shimmerBar 3s ease-in-out infinite; }
    .icon-glow { animation: iconPulse 4s ease-in-out infinite; }
  </style>

  <!-- 1. Background Layers -->
  <rect width="1200" height="380" fill="url(#bgGrad)" />
  <rect width="1200" height="380" fill="url(#meshCenter)" />
  <rect width="1200" height="380" fill="url(#cornerAmbient)" />

  <!-- 2. Dynamic Spreadsheet Grid Lines (Layered Behind Text) -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <!-- Horizontal Grid Lines -->
    <line x1="40" y1="60" x2="1160" y2="60" />
    <line x1="40" y1="110" x2="1160" y2="110" />
    <line x1="40" y1="160" x2="1160" y2="160" />
    <line x1="40" y1="210" x2="1160" y2="210" />
    <line x1="40" y1="260" x2="1160" y2="260" />
    <line x1="40" y1="310" x2="1160" y2="310" />

    <!-- Vertical Grid Lines -->
    <line x1="120" y1="40" x2="120" y2="340" />
    <line x1="240" y1="40" x2="240" y2="340" />
    <line x1="360" y1="40" x2="360" y2="340" />
    <line x1="480" y1="40" x2="480" y2="340" />
    <line x1="600" y1="40" x2="600" y2="340" />
    <line x1="720" y1="40" x2="720" y2="340" />
    <line x1="840" y1="40" x2="840" y2="340" />
    <line x1="960" y1="40" x2="960" y2="340" />
    <line x1="1080" y1="40" x2="1080" y2="340" />
  </g>

  <!-- Animated Data Flow Laser Beams across Grid -->
  <line x1="40" y1="160" x2="1160" y2="160" stroke="url(#gridBeamGrad)" stroke-width="2.5" class="flow-line" />
  <line x1="40" y1="260" x2="1160" y2="260" stroke="url(#gridBeamGrad)" stroke-width="2" class="flow-line" style="animation-duration: 5.5s;" />

  <!-- 3. Dynamic Ambient Floating Tech Cards (Positioned in Corners to Keep Center Clear) -->
  <!-- Floating Card Top Left: Format Preservation -->
  <g class="float-card-1" transform="translate(60, 48)">
    <rect width="180" height="42" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" filter="url(#softShadow)" />
    <circle cx="22" cy="21" r="5" fill="#10b981" />
    <text x="36" y="26" fill="#ecfdf5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">FORMAT PRESERVATION</text>
  </g>

  <!-- Floating Card Bottom Left: Formula Engine -->
  <g class="float-card-2" transform="translate(70, 290)">
    <rect width="195" height="42" rx="8" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.2" filter="url(#softShadow)" />
    <circle cx="22" cy="21" r="5" fill="#06b6d4" />
    <text x="36" y="26" fill="#cffafe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">FORMULA AST ENGINE</text>
  </g>

  <!-- Floating Card Top Right: High-Throughput Streaming -->
  <g class="float-card-3" transform="translate(940, 48)">
    <rect width="195" height="42" rx="8" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2" filter="url(#softShadow)" />
    <circle cx="22" cy="21" r="5" fill="#6366f1" />
    <text x="36" y="26" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">STREAMING XLSX / CSV</text>
  </g>

  <!-- Floating Card Bottom Right: Cloud Data Sheets -->
  <g class="float-card-1" transform="translate(945, 290)">
    <rect width="190" height="42" rx="8" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.2" filter="url(#softShadow)" />
    <circle cx="22" cy="21" r="5" fill="#3b82f6" />
    <text x="36" y="26" fill="#dbeafe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">CLOUD DATA SHEETS</text>
  </g>

  <!-- 4. Central Dynamic Glowing Backing (Subtle, Behind Title) -->
  <ellipse cx="600" cy="180" rx="360" ry="110" fill="#10b981" class="pulse-bg" filter="url(#glowFilter)" />

  <!-- 5. FOREGROUND: Main Title, Branding & Subtitle (Always on Top) -->
  <g id="title-group" transform="translate(600, 155)" text-anchor="middle">
    <!-- Top Category Tag / Pill -->
    <g transform="translate(0, -78)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.2" filter="url(#softShadow)" />
      <text x="0" y="4" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">SPREADSHEET DATA TOOLS</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="-12" fill="url(#emeraldGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.8" filter="url(#softShadow)">Awesome Spreadsheet Data Tools</text>

    <!-- Subtitle -->
    <text x="0" y="26" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="500" letter-spacing="0.2">Curated List of SaaS APIs, Open-Source Engines &amp; Headless Calculation Libraries</text>

    <!-- Decorative Gradient Accent Bar -->
    <rect x="-180" y="46" width="360" height="3" rx="1.5" fill="url(#emeraldGlow)" class="shimmer" />

    <!-- Feature Feature Tag Badges -->
    <g transform="translate(0, 74)">
      <!-- Pill 1: XLSX / XLS / CSV -->
      <g transform="translate(-230, 0)">
        <rect x="-55" y="-11" width="110" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">XLSX / XLS / CSV</text>
      </g>
      <!-- Pill 2: 400+ Formulas -->
      <g transform="translate(-75, 0)">
        <rect x="-65" y="-11" width="130" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Formula Evaluation</text>
      </g>
      <!-- Pill 3: Format Preservation -->
      <g transform="translate(80, 0)">
        <rect x="-65" y="-11" width="130" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Format Preservation</text>
      </g>
      <!-- Pill 4: Zero-OOM Streaming -->
      <g transform="translate(230, 0)">
        <rect x="-55" y="-11" width="110" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Disk Streaming</text>
      </g>
    </g>
  </g>
</svg>
